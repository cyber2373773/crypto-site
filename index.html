<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crypto Payment Page</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info {
      max-width: 60%;
    }
    .addr {
      word-break: break-all;
      font-size: 14px;
      margin-top: 8px;
      background: #f1f1f1;
      padding: 8px;
      border-radius: 5px;
    }
    img.qr {
      width: 140px;
      height: 140px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Send Crypto</h1>

  <!-- Bitcoin Section -->
  <div class="card">
    <div class="info">
      <h2>Bitcoin (BTC)</h2>
      <p>Send Bitcoin to this address:</p>
      <div class="addr">PUT_YOUR_BITCOIN_ADDRESS_HERE</div>
    </div>
    <a href="bitcoin:PUT_YOUR_BITCOIN_ADDRESS_HERE">
      <img class="qr" src="https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=bitcoin:PUT_YOUR_BITCOIN_ADDRESS_HERE" alt="BTC QR">
    </a>
  </div>

  <!-- Ethereum Section -->
  <div class="card">
    <div class="info">
      <h2>Ethereum (ETH)</h2>
      <p>Send Ethereum to this address:</p>
      <div class="addr">0x900FeC839aD53b6a51f229b7E9AB827CCA8625A8</div>
    </div>
    <a href="ethereum:0x900FeC839aD53b6a51f229b7E9AB827CCA8625A8">
      <img class="qr" src="https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=ethereum:0x900FeC839aD53b6a51f229b7E9AB827CCA8625A8" alt="ETH QR">
    </a>
  </div>

</body>
</html>
